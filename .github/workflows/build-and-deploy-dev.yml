name: Build Docker Container and Deploy to Dev

on:
  push:
    branches:
      - development

concurrency: development

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: 'Create env file'
        run: |
          touch .env
          echo NEXT_PUBLIC_BASE_URL_DEV=${{ secrets.NEXT_PUBLIC_BASE_URL_DEV }} >> .env
          echo NEXT_PUBLIC_STAGE=dev >> .env
          cat .env

      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_SECRET }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/dots-app:cms-build-dev-${{ github.run_number }}
      - 
        name: executing remote ssh commands using ssh key
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST_DEV }}
          username: ${{ secrets.SSH_USERNAME_DEV }}
          key: ${{ secrets.SSH_KEY_DEV }}
          port: ${{ secrets.SSH_PORT_DEV }}
          script: |
            cd dots-cms
            sed -i~ "/^CMS_IMAGE=/s/=.*/=${{ secrets.DOCKER_USERNAME }}\/dots-app:cms-build-dev-${{github.run_number}}/g" .env
            cat .env
            docker compose up -d