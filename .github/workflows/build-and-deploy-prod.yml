name: Build Docker Container and Deploy to Production

on:
  push:
    branches:
      - main

concurrency: main

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: 'Create env file'
        run: |
          touch .env
          echo NEXT_PUBLIC_BASE_URL_PRODUCTION=${{ secrets.NEXT_PUBLIC_BASE_URL_PRODUCTION }} >> .env
          echo NEXT_PUBLIC_STAGE=production >> .env
          cat .env

      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          # change this username after we created dockerhub account under dots email
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_SECRET }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: mdzk14/dots-app:cms-build-prod-${{ github.run_number }}
      - 
        name: executing remote ssh commands using ssh key
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd dots-cms-image
            sed -i~ "/^CMS_IMAGE=/s/=.*/=mdzk14\/dots-app:cms-build-prod-${{github.run_number}}/g" .env
            cat .env
            docker compose up -d